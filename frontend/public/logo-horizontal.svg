<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradientHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Background -->
  <circle cx="100" cy="100" r="80" fill="url(#gradientHoriz)" />
  
  <!-- House Icon (scaled down) -->
  <g>
    <!-- Roof -->
    <path d="M 100 60 L 140 85 L 140 90 L 100 65 L 60 90 L 60 85 Z" fill="white" opacity="0.9"/>
    
    <!-- House Body -->
    <rect x="65" y="85" width="70" height="50" fill="white" opacity="0.9" rx="3"/>
    
    <!-- Door -->
    <rect x="87.5" y="105" width="25" height="30" fill="#2563eb" rx="2"/>
    <circle cx="107.5" cy="120" r="2" fill="white"/>
    
    <!-- Windows -->
    <rect x="70" y="95" width="10" height="10" fill="#2563eb" rx="1"/>
    <rect x="120" y="95" width="10" height="10" fill="#2563eb" rx="1"/>
    
    <!-- Window Dividers -->
    <line x1="75" y1="95" x2="75" y2="105" stroke="white" stroke-width="1"/>
    <line x1="70" y1="100" x2="80" y2="100" stroke="white" stroke-width="1"/>
    <line x1="125" y1="95" x2="125" y2="105" stroke="white" stroke-width="1"/>
    <line x1="120" y1="100" x2="130" y2="100" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- DealiQ Text -->
  <text x="220" y="115" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#gradientHoriz)">
    DealiQ
  </text>
  
  <!-- Pro Text -->
  <text x="480" y="115" font-family="Arial, sans-serif" font-size="48" font-weight="300" fill="#6b7280">
    Pro
  </text>
  
  <!-- Tagline -->
  <text x="220" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#6b7280">
    Real Estate Deal Intelligence
  </text>
</svg>
