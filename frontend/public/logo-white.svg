<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon Background -->
  <circle cx="100" cy="100" r="80" fill="white" />
  
  <!-- House Icon -->
  <g>
    <!-- Roof -->
    <path d="M 100 60 L 140 85 L 140 90 L 100 65 L 60 90 L 60 85 Z" fill="#2563eb" opacity="0.9"/>
    
    <!-- House Body -->
    <rect x="65" y="85" width="70" height="50" fill="#2563eb" opacity="0.9" rx="3"/>
    
    <!-- Door -->
    <rect x="87.5" y="105" width="25" height="30" fill="white" rx="2"/>
    <circle cx="107.5" cy="120" r="2" fill="#2563eb"/>
    
    <!-- Windows -->
    <rect x="70" y="95" width="10" height="10" fill="white" rx="1"/>
    <rect x="120" y="95" width="10" height="10" fill="white" rx="1"/>
    
    <!-- Window Dividers -->
    <line x1="75" y1="95" x2="75" y2="105" stroke="#2563eb" stroke-width="1"/>
    <line x1="70" y1="100" x2="80" y2="100" stroke="#2563eb" stroke-width="1"/>
    <line x1="125" y1="95" x2="125" y2="105" stroke="#2563eb" stroke-width="1"/>
    <line x1="120" y1="100" x2="130" y2="100" stroke="#2563eb" stroke-width="1"/>
  </g>
  
  <!-- DealiQ Text -->
  <text x="220" y="115" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">
    DealiQ
  </text>
  
  <!-- Pro Text -->
  <text x="480" y="115" font-family="Arial, sans-serif" font-size="48" font-weight="300" fill="white" opacity="0.8">
    Pro
  </text>
  
  <!-- Tagline -->
  <text x="220" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="white" opacity="0.7">
    Real Estate Deal Intelligence
  </text>
</svg>
